<!DOCTYPE html>
<html>

<head>
    <title>{% block title %}Flask App{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <style>
        .flash {
            padding: 10px 15px;
            margin-bottom: 10px;
            border-radius: 5px;
        }

        .flash.success {
            background-color: #41ba5d;
            color: #155724;
            border: 1px solid #3f7b4d;
        }

        .flash.error {
            background-color: #8b585d;
            color: #721c24;
            border: 1px solid #ca2232;
        }

        .flash.info {
            background-color: #7cd9e9;
            color: #0c5460;
            border: 1px solid #456367;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="nav">
            <a href="/">Home</a>
            <a href="/login">Login</a>
            <a href="/upload">Upload</a>
        </div>
        <hr>
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        {% for category, message in messages %}
        <div class="flash flash-{{ category }}">
            {{ message }}
        </div>
        {% endfor %}
        {% endif %}
        {% endwith %}
        {% block content %}{% endblock %}
    </div>
</body>

</html>
